apiVersion: 1
datasources:
  - name: Rumah
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${PG_DB}
    user: ${PG_GRAFANA_USER}
    secureJsonData:
      password: ${PG_GRAFANA_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false
