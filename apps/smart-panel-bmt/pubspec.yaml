name: smart_panel_bmt
description: "Offline Android and iOS design review demo for Smart Panel BMT."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.5 <3.12.0'
  flutter: '>=3.41.9 <3.42.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^20.1.0
  local_auth: ^3.0.0
  local_auth_android: 2.0.8
  local_auth_darwin: 2.0.5
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/fonts/OFL.txt
    - assets/mock/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
          weight: 100
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/InterVariable.ttf
          weight: 700
