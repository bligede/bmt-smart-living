# Tumpukan rumah pintar BMT — berjalan di satu Raspberry Pi 5, di dalam rumah pelanggan.
# Hanya cloudflared yang punya jalur keluar. Sisanya terikat ke 127.0.0.1.

name: rumah

services:

  # --- Basis data: riwayat operasional + telemetri jangka panjang ---
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Terbuka hanya ke localhost — Home Assistant memakai network_mode host
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1200M

  # --- Broker pesan: perangkat menerbitkan ke sini, sebelum Home Assistant ---
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mqttdata:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      TZ: ${TZ}
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Kendali dan otomasi. network_mode host wajib untuk penemuan perangkat ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.8
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2500M

  # --- Penyerap MQTT ke tabel milik kita sendiri ---
  ingester:
    build: ./ingester
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RUMAH_ID: ${RUMAH_ID}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      PG_DSN: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    volumes:
      - ./ingester/pemetaan.yaml:/app/pemetaan.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 192M

  # --- Pengirim agregat ke server pusat BMT. Menumpuk lalu menyusul ---
  pusher:
    build: ./pusher
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RUMAH_ID: ${RUMAH_ID}
      PG_DSN: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      BMT_API_URL: ${BMT_API_URL}
      BMT_API_TOKEN: ${BMT_API_TOKEN}
      INTERVAL_DETIK: "300"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Dasbor pemantauan. BACA SAJA — tidak ada kendali dari sini ---
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      PG_DB: ${PG_DB}
      PG_GRAFANA_USER: ${PG_GRAFANA_USER}
      PG_GRAFANA_PASSWORD: ${PG_GRAFANA_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M

  # --- Penyusun firmware untuk perangkat Sonoff. Boleh dimatikan sehari-hari ---
  esphome:
    image: ghcr.io/esphome/esphome:2025.7
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./esphome:/config
    environment:
      TZ: ${TZ}
      ESPHOME_DASHBOARD_USE_PING: "true"
    profiles: ["flashing"]

  # --- Satu-satunya jalur keluar ---
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    network_mode: host
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - homeassistant

volumes:
  pgdata:
  mqttdata:
  grafanadata:
