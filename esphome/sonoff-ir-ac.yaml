# Pengirim perintah inframerah untuk AC, berbasis ESP32.
#
# Inframerah bersifat SATU ARAH. Perangkat ini mengirim perintah, tetapi tidak
# pernah tahu apakah AC benar-benar menerimanya. Lapisan pemastiannya ada di
# tempat lain: relay berpengukur arus pada sirkuit AC. Jangan pasang salah satu
# tanpa yang lain — tanpa pengukur arus, sistem hanya menebak.
#
# Sensor suhu di sini dipakai sebagai pemicu otomasi, bukan sebagai umpan balik AC.

substitutions:
  nama: kamartidur-ir
  nama_tampil: Kamar tidur inframerah
  ruang: kamartidur

esphome:
  name: ${nama}
  friendly_name: ${nama_tampil}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${nama}-darurat"
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: ${nama}
  discovery: false
  will_message:
    topic: rumah/kejadian/perangkat_luring
    payload: '{"perangkat": "${nama}", "tingkat": "penting"}'

# Pemancar inframerah. Butuh GARIS PANDANG ke unit AC —
# terhalang lemari berarti perlu pemancar tambahan, bukan daya yang lebih besar.
remote_transmitter:
  pin: GPIO14
  carrier_duty_percent: 50%

# Penerima dipakai sekali saat komisioning untuk merekam kode remote asli
# pada merek AC yang belum dikenal. Boleh dilepas setelah selesai.
remote_receiver:
  pin:
    number: GPIO15
    inverted: true
    mode: INPUT_PULLUP
  dump: all
  tolerance: 55%

climate:
  # Ganti platform sesuai merek AC. Daftar lengkap ada di dokumentasi ESPHome.
  # Bila mereknya tidak ada, rekam kode remote asli lewat remote_receiver
  # lalu susun sebagai climate_ir_lg atau pakai platform 'climate.custom'.
  - platform: daikin
    name: "${nama_tampil} AC"
    sensor: suhu_ruang
    visual:
      min_temperature: 18
      max_temperature: 30
      temperature_step: 1

sensor:
  - platform: dht
    pin: GPIO4
    model: AM2302
    temperature:
      name: "${nama_tampil} suhu"
      id: suhu_ruang
      filters:
        - median:
            window_size: 5
            send_every: 5
    humidity:
      name: "${nama_tampil} kelembapan"
    update_interval: 60s

  - platform: uptime
    name: "${nama_tampil} waktu nyala"
    update_interval: 300s

  - platform: wifi_signal
    name: "${nama_tampil} sinyal"
    update_interval: 300s
